name: Update project portfolio once

on:
  push:
    paths:
      - '.github/workflows/update-projects-once.yml'

permissions:
  contents: write

jobs:
  update-projects:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update project cards and translations
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          s = path.read_text(encoding='utf-8')

          new_projects = '''  <section class="projects" id="proyectos"><div class="inner"><div class="projects-head"><div><div class="kicker" data-i18n="projectsKicker">Proyectos</div><h2 class="title" data-i18n="projectsTitle">Aprender construyendo.</h2></div><p data-i18n="projectsIntro">Aquí reúno las aplicaciones y proyectos que he desarrollado hasta ahora, desde herramientas personales hasta los proyectos que siguen creciendo.</p></div><div class="cards">
    <article class="card"><div class="meta"><span data-i18n="inDev">En desarrollo</span><span>Android</span></div><h3>Asistente Taxista Salou</h3><p data-i18n="taxi">Aplicación Android orientada a simplificar tareas y consultas del trabajo diario del taxi, con información local, utilidades y experimentación con Android Auto.</p><div class="tags"><span>Kotlin</span><span>Android</span><span>Android Auto</span><span>GPS</span></div></article>
    <article class="card"><div class="meta"><span data-i18n="inDev">En desarrollo</span><span>Mobile</span></div><h3>DiveMap</h3><p data-i18n="divemap">Proyecto para explorar puntos de buceo de todo el mundo con información útil y una representación visual del fondo que ayude a entender cada inmersión antes de entrar al agua.</p><div class="tags"><span>Maps</span><span>UX</span><span>AI</span><span data-i18n="community">Comunidad</span></div></article>
    <article class="card"><div class="meta"><span data-i18n="projectLabel">Proyecto</span><span>Android</span></div><h3>Taxi Assistant</h3><p data-i18n="taxiAssistant">Aplicación Android para registrar y organizar información del trabajo diario del taxi, con OCR, geolocalización, almacenamiento local y gestión segura del histórico.</p><div class="tags"><span>Android</span><span>OCR</span><span>Room</span><span>GPS</span></div></article>
    <article class="card"><div class="meta"><span data-i18n="projectLabel">Proyecto</span><span>Android</span></div><h3>Taxi Zone Mapper</h3><p data-i18n="taxiMapper">Herramienta Android creada para capturar y estructurar información de zonas mediante geolocalización y reconocimiento de texto con ML Kit.</p><div class="tags"><span>Kotlin</span><span>Android</span><span>ML Kit</span><span>GPS</span></div></article>
    <article class="card"><div class="meta"><span data-i18n="completed">Completada</span><span>Windows</span></div><h3>CuestionarioApp</h3><p data-i18n="quiz">Aplicación de escritorio para Windows desarrollada en C# y .NET, con interfaz WinForms, sistema de acceso y base de datos SQLite para trabajar con cuestionarios.</p><div class="tags"><span>C#</span><span>.NET 8</span><span>WinForms</span><span>SQLite</span></div></article>
  </div></div></section>'''

          pattern = r'  <section class="projects" id="proyectos">.*?</section>\n\n  <section class="skills"'
          s, n = re.subn(pattern, new_projects + '\n\n  <section class="skills"', s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('Project section replacement failed')

          old_cards = '.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}'
          new_cards = '.cards{display:grid;grid-template-columns:repeat(6,1fr);gap:18px}.card{grid-column:span 2}.card:nth-child(4){grid-column:2/span 2}.card:nth-child(5){grid-column:4/span 2}'
          if old_cards not in s:
              raise SystemExit('Cards CSS replacement failed')
          s = s.replace(old_cards, new_cards, 1)
          s = s.replace('.cards{grid-template-columns:1fr}.skill-grid', '.cards{grid-template-columns:1fr}.card,.card:nth-child(4),.card:nth-child(5){grid-column:auto}.skill-grid', 1)

          replacements = {
            "projectsIntro:'Este espacio irá creciendo con los proyectos en los que vaya trabajando. Es una fotografía de lo que estoy construyendo ahora.'": "projectsIntro:'Aquí reúno las aplicaciones y proyectos que he desarrollado hasta ahora, desde herramientas personales hasta los proyectos que siguen creciendo.'",
            "inDev:'En desarrollo',taxi:": "inDev:'En desarrollo',projectLabel:'Proyecto',completed:'Completada',taxi:",
            "community:'Comunidad',web:": "community:'Comunidad',taxiAssistant:'Aplicación Android para registrar y organizar información del trabajo diario del taxi, con OCR, geolocalización, almacenamiento local y gestión segura del histórico.',taxiMapper:'Herramienta Android creada para capturar y estructurar información de zonas mediante geolocalización y reconocimiento de texto con ML Kit.',quiz:'Aplicación de escritorio para Windows desarrollada en C# y .NET, con interfaz WinForms, sistema de acceso y base de datos SQLite para trabajar con cuestionarios.',web:",

            "projectsIntro:'Aquest espai anirà creixent amb els projectes en què vagi treballant.'": "projectsIntro:'Aquí reuneixo les aplicacions i projectes que he desenvolupat fins ara, des d’eines personals fins als projectes que continuen creixent.'",
            "inDev:'En desenvolupament',taxi:": "inDev:'En desenvolupament',projectLabel:'Projecte',completed:'Completada',taxi:",
            "community:'Comunitat',web:": "community:'Comunitat',taxiAssistant:'Aplicació Android per registrar i organitzar informació del treball diari del taxi, amb OCR, geolocalització, emmagatzematge local i gestió segura de l’històric.',taxiMapper:'Eina Android creada per capturar i estructurar informació de zones mitjançant geolocalització i reconeixement de text amb ML Kit.',quiz:'Aplicació d’escriptori per a Windows desenvolupada en C# i .NET, amb interfície WinForms, sistema d’accés i base de dades SQLite per treballar amb qüestionaris.',web:",

            "projectsIntro:'This space will grow with the projects I work on.'": "projectsIntro:'Here I bring together the applications and projects I have built so far, from personal tools to projects that are still evolving.'",
            "inDev:'In development',taxi:": "inDev:'In development',projectLabel:'Project',completed:'Completed',taxi:",
            "community:'Community',web:": "community:'Community',taxiAssistant:'Android application for recording and organising day-to-day taxi information, with OCR, geolocation, local storage and safe management of historical data.',taxiMapper:'Android tool created to capture and structure zone information using geolocation and ML Kit text recognition.',quiz:'Windows desktop application built with C# and .NET, using WinForms, a login system and an SQLite database for working with questionnaires.',web:",

            "projectsIntro:'พื้นที่นี้จะเติบโตไปพร้อมกับโปรเจกต์ที่ผมทำ'": "projectsIntro:'ที่นี่ผมรวบรวมแอปและโปรเจกต์ที่พัฒนามาจนถึงตอนนี้ ตั้งแต่เครื่องมือส่วนตัวไปจนถึงโปรเจกต์ที่ยังพัฒนาต่อเนื่อง'",
            "inDev:'กำลังพัฒนา',taxi:": "inDev:'กำลังพัฒนา',projectLabel:'โปรเจกต์',completed:'เสร็จสมบูรณ์',taxi:",
            "community:'ชุมชน',web:": "community:'ชุมชน',taxiAssistant:'แอป Android สำหรับบันทึกและจัดระเบียบข้อมูลการทำงานประจำวันของแท็กซี่ พร้อม OCR ตำแหน่งทางภูมิศาสตร์ การจัดเก็บข้อมูลในเครื่อง และการจัดการประวัติอย่างปลอดภัย',taxiMapper:'เครื่องมือ Android สำหรับรวบรวมและจัดโครงสร้างข้อมูลพื้นที่โดยใช้ตำแหน่งทางภูมิศาสตร์และการรู้จำข้อความด้วย ML Kit',quiz:'แอปเดสก์ท็อปสำหรับ Windows พัฒนาด้วย C# และ .NET ใช้ WinForms ระบบเข้าสู่ระบบ และฐานข้อมูล SQLite สำหรับจัดการแบบทดสอบ',web:"
          }

          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Translation replacement failed: {old[:50]}')
              s = s.replace(old, new, 1)

          path.write_text(s, encoding='utf-8')
          PY

      - name: Commit updated portfolio
        shell: bash
        run: |
          git config user.name "Redgumer Portfolio Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Show all software projects in portfolio"
          git push
