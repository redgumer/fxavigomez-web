name: Remove contact result messages once

on:
  push:
    paths:
      - '.github/workflows/remove-contact-result-messages.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove post-send result messages
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = """    document.getElementById('contactForm').addEventListener('submit',async e=>{e.preventDefault();if(!e.currentTarget.reportValidity())return;if(!turnstileToken){status.textContent='Espera a que termine la verificación de seguridad.';return}submit.disabled=true;const f=new FormData(e.currentTarget);status.textContent='Enviando…';try{const r=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.get('name'),email:f.get('email'),subject:f.get('subject'),message:f.get('message'),turnstileToken})});const j=await r.json();if(j.ok){status.textContent='Mensaje enviado correctamente.';e.currentTarget.reset();turnstileToken='';try{window.turnstile?.reset?.()}catch(err){console.warn('Turnstile reset skipped',err)}}else{status.textContent=j.error||'No se ha podido enviar el mensaje todavía.'}}catch{status.textContent='No se ha podido enviar el mensaje todavía.'}finally{if(turnstileToken)submit.disabled=false}});"""
          new = """    document.getElementById('contactForm').addEventListener('submit',async e=>{e.preventDefault();if(!e.currentTarget.reportValidity())return;if(!turnstileToken){status.textContent='Espera a que termine la verificación de seguridad.';return}submit.disabled=true;const f=new FormData(e.currentTarget);status.textContent='';try{const r=await fetch('/api/contact',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:f.get('name'),email:f.get('email'),subject:f.get('subject'),message:f.get('message'),turnstileToken})});if(r.ok){e.currentTarget.reset()}else{console.error('Contact request failed:',r.status)}}catch(err){console.error('Contact request error:',err)}finally{status.textContent='';turnstileToken='';submit.disabled=true;try{window.turnstile?.reset?.()}catch(err){console.warn('Turnstile reset skipped',err)}}});"""
          if old not in s:
              raise SystemExit('Expected contact submit handler not found')
          p.write_text(s.replace(old, new), encoding='utf-8')
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove contact form send result messages"
          git push
